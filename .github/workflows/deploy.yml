name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: vietrochack-lab
  REGION: us-central1
  SERVICE_NAME: teachxr-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest httpx
          GEMINI_API_KEY=test python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation, no stored key

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Same steps, same order as scripts/deploy.sh.
      - name: Build backend image
        run: |
          echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/teachxr/server:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          gcloud builds submit backend \
            --config=backend/cloudbuild.yaml \
            --substitutions=_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/teachxr/server:${GITHUB_SHA::7}" \
            --project="$PROJECT_ID"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --allow-unauthenticated \
            --max-instances=3 \
            --concurrency=20 \
            --timeout=600 \
            --set-secrets=GEMINI_API_KEY=teachxr-gemini-api-key:latest \
            --project="$PROJECT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting:teachxr \
            --project "$PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend service: $SERVICE_NAME ($REGION), image $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://teachxr.vietrochack.com" >> "$GITHUB_STEP_SUMMARY"
